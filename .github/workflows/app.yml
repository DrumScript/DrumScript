name: Build & deploy app

# Deploys the static browser app (app/ + public/) to GitHub Pages root.
# Coexists with the Sphinx docs workflow via keep_files: true so neither
# deployment nukes the other.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

# Only one app deploy at a time. Cancel any in-flight deploy if a newer
# push lands — saves CI minutes and avoids out-of-order publishes.
concurrency:
  group: pages-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # peaceiris/actions-gh-pages needs write access
    steps:
      - uses: actions/checkout@v4

      - name: Stage app for deploy
        run: |
          # Build directory layout that mirrors what the deployed site needs.
          # No build tools — plain HTML/JS, just file copies.
          mkdir -p _site
          cp -r app/. _site/
          mkdir -p _site/public
          cp -r public/. _site/public/
          # Add a .nojekyll so GitHub Pages doesn't try to Jekyll-process us.
          # (Avoids it ignoring any folder/file starting with an underscore.)
          touch _site/.nojekyll
          ls -la _site/

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          # Empty destination_dir = repo root on gh-pages branch.
          destination_dir: ''
          # CRUCIAL: don't delete files already on gh-pages (i.e. /docs/).
          keep_files: true
          commit_message: 'deploy: app from ${{ github.sha }}'
