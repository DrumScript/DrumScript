name: Build & deploy docs

# Builds the Sphinx (Shibuya) site and deploys it to gh-pages /docs/.
# Pairs with app.yml which deploys to gh-pages root.
# Both use keep_files: true so neither workflow wipes the other.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'drumscript/**'              # autosummary depends on the source
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project + dev deps
        run: |
          uv venv
          # Activate venv for subsequent steps in this job.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv sync --extra dev

      - name: Build Sphinx site
        run: |
          cd docs
          make html

      - name: Deploy to gh-pages /docs/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          # Subfolder under gh-pages branch root.
          destination_dir: docs
          # CRUCIAL: don't delete files already on gh-pages (i.e. the app at /).
          keep_files: true
          commit_message: 'deploy: docs from ${{ github.sha }}'
