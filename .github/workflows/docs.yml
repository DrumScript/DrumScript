name: Build & deploy docs

# Builds the Sphinx (Shibuya) site and deploys it to gh-pages /docs/.
# Pairs with app.yml which deploys to gh-pages root.
# Both use keep_files: true so neither workflow wipes the other.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    # --- COMMENTED OUT OLD PATHS RESTRICTION ---
    # Paths filter commented out because tag pushes don't carry path info.
    # If paths filter is active, tag pushes are silently ignored.
    # paths:
    #   - "docs/**"
    #   - "drumscript/**"
    #   - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project + dev deps
        run: |
          uv venv
          # Activate venv for subsequent steps in this job.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv sync --extra dev

      # ── Version routing ──────────────────────────────────────────
      # Tag push (e.g. v0.2.0)  → VERSION_DIR=v0.2.0, IS_RELEASE=true
      # Main branch push        → VERSION_DIR=dev,     IS_RELEASE=false
      - name: Determine version directory
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION_DIR=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            echo "VERSION_DIR=dev" >> $GITHUB_ENV
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Build Sphinx
        run: uv run sphinx-build -b html docs docs/_build/html

      # ── Deploy 1: Version-specific folder ────────────────────────
      # e.g. /v0.1.6/ or /dev/
      - name: Deploy to version folder
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          publish_dir: ./docs/_build/html
