name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - feat/add_submission_template

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remind contributors to update the changelog
        shell: bash
        run: |
          changed_files="$(git diff --name-only \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')"

          if grep -Fxq 'CHANGELOG.md' <<< "$changed_files"; then
            echo "CHANGELOG.md is included in this PR."
          elif grep -Eq '^(drumscript/|pyproject\.toml$|requirements[^/]*$|uv\.lock$|setup\.py$|setup\.cfg$|\.github/workflows/)' <<< "$changed_files"; then
            echo "::warning::This PR changes code, dependencies, or CI configuration. Please add a user-facing entry under [Unreleased] in CHANGELOG.md when appropriate. Documentation-only and test-only changes do not need an entry."
          else
            echo "No implementation or build changes detected; no changelog reminder needed."
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Install the package and all dev dependencies
          uv sync --all-extras

      - name: Lint and Format with Ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run tests with pytest
        run: uv run pytest -m "not slow"
