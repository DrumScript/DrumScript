[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drumscript"
version = "0.2.0"
description = "A Python package to convert drum audio to sheet music."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9,<3.14"
authors = [
  { name="drumscript-admin", email="hello.drumscript@gmail.com" },
]

keywords = ["drum", "audio", "music", "sheet-music", "notation", "dsp", "machine-learning", "drumscript", "drums", "percussion", "sound analysis", "eq", "atd", "automatic-drum-transcription"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Other Audience",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Sound/Audio :: Players :: MP3",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "demucs",
    "librosa",
    "matplotlib",
    "music21",
    "nbstripout[dev]>=0.8.2",
    "numba",
    "numpy<2",
    "pretty-midi",
    "pydub",
    "reportlab",
    "scipy",
    "soundfile",
    "torch>=2.4,<2.9",
    "torchaudio>=2.4,<2.9",
]
# Note: torch only compatible with Python ABI tags cp39-cp312. Not yet compatible with 3.13.

[project.urls]
"Homepage" = "https://drumscript.github.io/DrumScript/"
"Documentation" = "https://drumscript.github.io/DrumScript/"
"Repository" = "https://github.com/DrumScript/DrumScript"
"Issues" = "https://github.com/DrumScript/DrumScript/issues"

[project.optional-dependencies]
dev = [
  "ipykernel",
  "myst-parser",
  "myst-nb>=1.3.0",
  "mir-eval>=0.8.2",
  "pytest",
  "pytest-cov>=7.1.0",
  "shibuya>=2025.10.21",
  "ipywidgets>=8.1.8",
  "requests>=2.32.5",
  "ruff>=0.15.11",
  "twine>=6.2.0",
  "nbstripout>=0.8.2",
]

[project.scripts]
# Points at cli(), not main(). The console script calls its target with no
# arguments; main() takes explicit keyword args, so pointing here directly
# raised TypeError on every invocation. cli() parses argv and forwards.
drumscript = "drumscript.main:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# By default, setuptools finds all directories with __init__.py
where = ["."]
include = ["drumscript*"]
exclude = [
    "local_tests*",
    ".development*",
    ".archive/*",
    "test_audio*",
    "visuals/",
    "outputs/",
    "*/logs/*",
    "*/proofs/*",
    "*/__pycache__/*",
    "drumscript.utils.research*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["local_tests", "outputs", "docs"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: requires real Demucs / ffmpeg / network access",
]
filterwarnings = [
    "ignore::DeprecationWarning:audioread.rawread",
    "ignore:'aifc' is deprecated:DeprecationWarning",
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore:'sunau' is deprecated:DeprecationWarning",
]
addopts = "-v --tb=short --strict-markers --ignore=local_tests/classification_engine --ignore=local_tests/mp3_conversion --ignore=pdf_generation"

# --- RUFF CONFIGURATION ---
[tool.ruff]
# Markdown code blocks are illustrative documentation, not executed source.
# ruff >=0.16 formats them by default, which reflows deliberate one-liner
# snippets (e.g. `import platform; print(...)`) and collapses readable
# multi-line examples. Exclude them so ruff governs real Python only.
extend-exclude = ["*.md"]
# Set the maximum line length
line-length = 150
# Target Python 3.9 as minimum supported version
target-version = "py39"

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), isort (I), and pyupgrade (UP)
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.ruff.format]
# Enforce double quotes and standard spacing (Black-compatible)
quote-style = "double"
indent-style = "space"
